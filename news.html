<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Updates: CausalAlpha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<script src="shared.js"></script>
</head>
<body>
<script>renderNav('news')</script>

<div class="container">
  <div class="page-title">Research <em>Updates</em></div>
</div>

<section class="section-sm">
  <div class="container">
    <p class="section-label">All updates, latest first</p>
    <div class="news-feed reveal" id="news-feed"></div>
  </div>
</section>

<script>
// Superseded figures from earlier entries are not repeated here: the corrected
// headline is the only performance claim, and it is loaded from headline.json.
const MILESTONES = [
  {
    date: '2026-10-28', type: 'RESULT', badge: 'fail', id: 'prereg',
    title: 'Pre-registered test on untouched sectors: no edge after costs',
    summary: 'The rules and the test were frozen and committed before three NSE sectors the rules had never seen were downloaded. On those sectors, after costs, no timing rule, causal-discovery filter or reinforcement-learning agent beat buy-and-hold.',
    body: `<p>The previous corrected figures were measured from 2023 on the same five sectors the rule was built on, and that window had been used to choose the rule, so they were not a fair test. The new test uses Nifty Auto, Metal and Realty from 2021, with one information set, next-close execution, NSE costs and cash earning the repo rate for every approach.</p>
    <div id="news-headline"><p>Loading figures</p></div>
    <p>VIX_GATE's shallower drawdowns came from holding less of the time: a fixed index mix with the same exposure had a smaller worst fall. Every number is rebuilt by one command from frozen data.</p>`
  },
  {
    date: '2026-10-20', type: 'CORRECTION', badge: 'fail', id: 'correction',
    title: 'Correction: two sets of figures withdrawn, headline restated',
    summary: 'Two separate problems, two separate withdrawals. The earlier VIX_GATE headline (2x leverage) was overstated by a leverage-cost bug. The blended ADX+MOM20 portfolio figures were never a valid test: in-sample, grid-searched, and including the failed straddle.',
    body: `<p><strong>1. VIX_GATE headline, leverage-cost bug.</strong> The earlier VIX_GATE Sharpe and annual return were run at 2x leverage while trading costs were charged as if the position were 1x. The bug is fixed in every backtester and covered by tests. A second bug forced the strategy into cash for the first 20 trading days of every test window while its indicators warmed up; that is fixed too. The figures recomputed then were later withdrawn as well; see the 28 Oct entry.</p>
    <p><strong>2. Blended ADX+MOM20 portfolio, in-sample.</strong> This blend was once shown as the headline. Its figures are withdrawn for a different reason: they were in-sample, the ADX threshold and weights were grid-searched on the same data used to score them, and the blend included the failed straddle. It was never validated and now sits under Experimental on the Backtest page.</p>`
  },
  {
    date: '2026-06-03', type: 'RESEARCH', badge: 'warn',
    title: 'Bear-side experiments: PUT leg, IVIX slope gate',
    summary: 'Experimental, not validated. A weekly PUT leg and an extra straddle gate were added to the paper trader for research. Neither is part of the headline strategy.',
    body: `<p>PUT leg: <code>bear_score ≥ 5 AND bear_score &gt; bull_score AND VIX &lt; 25</code> enters an ATM PUT on Monday and exits Tuesday. Paper only.</p>
    <p>IVIX slope gate: a proxy for VIX term-structure backwardation (Johnson 2017, JFQA), added as a further straddle gate. The straddle itself remains frozen.</p>
    <p>Research verdict: India's transaction-cost stack makes pairs and single-stock-future shorting unviable at monthly frequency.</p>`
  },
  {
    date: '2026-06-02', type: 'RESEARCH', badge: 'warn',
    title: 'ADX+MOM20 gate and blended-portfolio grid search (withdrawn)',
    summary: 'Experimental, in-sample, not validated. The ADX threshold and portfolio weights were grid-searched on the same data used to score them, and the blend included the failed straddle. Figures withdrawn.',
    body: `<p>A PCA audit found the 8 composite signals genuinely independent (7 components for 90% of variance). Variable leverage made drawdowns far worse and was closed.</p>
    <p>A bug was fixed in the paper trader: when the gate was off it held the sector at 1x instead of going to cash as the backtest assumed.</p>`
  },
  {
    date: '2026-06-01', type: 'FINDING', badge: 'research',
    title: 'Regime audit: most components overfit',
    summary: 'Audit across 6 market regimes: 7 of 9 strategy components were overfit to one period. 368 signals tested, 3% pass significance, about what chance predicts. Causal filters hurt.',
    body: `<p><strong>Overfit components:</strong> rate_shock_gate (tuned to the 2022 peak), momentum_bleed_gate (2017-specific), a weekly directional signal set (failed out-of-sample), sector exclusions, and the 576-combination straddle grid.</p>
    <p><strong>Causal signals:</strong> adding causal filters to the VIX gate lowered the Sharpe ratio. The relationships are real (the US S&amp;P 500 Granger-causes Indian sector returns) but already embedded in the VIX signal.</p>
    <p><strong>Gap:</strong> no validated strategy for a prolonged bear market.</p>`
  },
  {
    date: '2026-05-30', type: 'MILESTONE', badge: 'research',
    title: 'Paper trader deployed',
    summary: 'Automated paper trading started on 2026-05-30 with separate sub-accounts for NSE sector rotation, weekly options and the (frozen) straddle. Paper only; no real capital.',
    body: `<p>Current paper positions and NAV are on the Live page, read from paper_state.json.</p>`
  },
  {
    date: '2026-05-29', type: 'SIGNAL', badge: 'fail',
    title: 'Straddle: failed out-of-sample, frozen',
    summary: 'The Nifty monthly straddle failed out-of-sample. Across its 576-combination parameter grid only 7.6% of settings had a positive Sharpe ratio (research log section 16.7). Frozen.',
    body: `<p>The in-sample result came from many tuned parameters on few trades, a classic overfitting pattern. Any straddle on the Live page is a paper record only.</p>`
  },
  {
    date: '2026-05-27', type: 'RESEARCH', badge: 'warn',
    title: 'Weekly directional options (figures withdrawn)',
    summary: 'The direction signal was real, but option time decay erased the edge and the signal combination was chosen on the same data. Earlier Sharpe figures are withdrawn; the Backtest page computes statistics directly from the trade log.',
    body: `<p>Tuesday-close exits beat Thursday-close exits across the combinations tested.</p>`
  },
];

const feed = document.getElementById('news-feed');

loadMarkdown('data/live/reports/latest.md')
  .then(md => renderAll(md, null))
  .catch(err => renderAll(null, err));

function renderAll(reportMd, reportErr) {
  const items = [...MILESTONES];
  if (reportMd) {
    const m = reportMd.match(/\d{4}-\d{2}-\d{2}/);
    const when = m ? fmtDayMonthYear(m[0]) : 'date unknown';
    items.splice(1, 0, {
      date: m ? m[0] : 'date unknown', type: 'REPORT', badge: 'idle', html: true,
      title: 'Paper-trading report, ' + when,
      summary: 'Automated daily report from the paper trader, dated ' + when + '. Paper only. The straddle sub-account is frozen: it failed out-of-sample.',
      body: '<p class="report-date">Report date: <strong>' + esc(m ? m[0] : 'unknown') + '</strong></p>' +
        '<div class="report-content">' + markFrozenStraddle(renderMarkdown(reportMd)) + '</div>'
    });
  }

  feed.innerHTML = items.map((item, i) => `
    <div class="news-card${item.type === 'REPORT' ? ' news-report' : ''}">
      <h3 class="news-head">
        <button type="button" class="news-toggle" aria-expanded="${i === 0}" aria-controls="news-body-${i}">
          <span class="news-card-header">
            <span class="news-date">${esc(item.date)}</span>
            <span class="badge ${esc(item.badge)}">${esc(item.type)}</span>
          </span>
          <span class="news-title">${esc(item.title)}</span>
          <span class="news-summary">${esc(item.summary)}</span>
        </button>
      </h3>
      <div class="news-body${i === 0 ? ' open' : ''}" id="news-body-${i}">${item.body}</div>
    </div>
  `).join('');
  feed.querySelectorAll('.news-toggle').forEach(btn => btn.addEventListener('click', () => toggleCard(btn)));

  if (reportErr) {
    feed.insertAdjacentHTML('afterbegin', '<div id="report-error"></div>');
    loadError(document.getElementById('report-error'), 'latest paper-trading report', reportErr);
  }

  loadHeadline().then(h => {
    document.getElementById('news-headline').innerHTML =
      '<p><strong>' + esc(headlineBasis(h)) + '</strong></p><table><tbody>' +
      headlineCells(h).map(c => '<tr><td>' + esc(c.label) + '</td><td>' + esc(c.value) + '</td><td>' + esc(c.sub) + '</td></tr>').join('') +
      '</tbody></table><p>' + esc(headlineVerdict(h) + ' ' + headlineEvidence(h)) + '</p>';
  }).catch(err => headlineError(document.getElementById('news-headline'), err));
}

function toggleCard(btn) {
  const body = document.getElementById(btn.getAttribute('aria-controls'));
  if (!body) return;
  const open = body.classList.toggle('open');
  btn.setAttribute('aria-expanded', String(open));
}
</script>
</body>
</html>
